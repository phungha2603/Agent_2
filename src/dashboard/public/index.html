<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent Company</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>AI Agent Company</h1>
      <p class="topbar-sub">Sếp (AG-01) lập cây công việc → Gemini thẩm định → bạn duyệt → cả đội chạy song song, bàn giao cho nhau, bạn chốt từng kết quả.</p>
    </div>
    <div class="command">
      <input id="goal-input" type="text" placeholder="Mục tiêu, ví dụ: Xây dựng hệ thống phân tích dữ liệu & dashboard theo dõi vận hành" />
      <input id="project-dir-input" type="text" placeholder="Thư mục dự án (đường dẫn tuyệt đối, nên là thư mục riêng)" title="Nơi Muse ghi code và nơi chạy lệnh build/test của kế hoạch này" />
      <div class="goal-options">
        <label class="check" title="Task qua kiểm tra, được Gemini & Claude duyệt và không có cảnh báo đỏ sẽ tự ship; task có cảnh báo vẫn chờ bạn. Dự án có git thì mỗi task là một commit, hoàn tác được."><input type="checkbox" id="opt-autoapprove" /> ⚡ Tự duyệt khi xanh</label>
        <label class="check" id="opt-github-label" title="Khi duyệt kế hoạch: tạo repo GitHub riêng tư cho dự án; mỗi task được duyệt sẽ được commit và push lên đó."><input type="checkbox" id="opt-github" checked /> Tạo repo GitHub riêng</label>
        <label class="check" title="Subtask mà Gemini đã duyệt, không có cảnh báo đỏ thì bỏ bước Claude review (task nghiệm thu và yêu cầu sửa của bạn luôn qua Claude). Tiết kiệm quota Claude."><input type="checkbox" id="opt-skipreview" /> Bỏ Claude review khi Gemini duyệt &amp; xanh</label>
      </div>
      <button id="run-all-btn" class="btn btn-primary">▶ Chạy luồng cả công ty</button>
      <button id="pause-btn" class="btn btn-ghost" title="Không bắt đầu bước mới; các lượt đang chạy được làm nốt">⏸ Pause</button>
      <button id="stop-btn" class="btn btn-ghost btn-danger-ghost" title="Huỷ ngay mọi lượt đang chạy (bước đó sẽ chạy lại khi Resume)">⏹ Stop</button>
      <button id="reset-btn" class="btn btn-ghost">Reset</button>
      <span id="review-badges" class="review-badges"></span>
      <button id="approve-all-btn" class="btn btn-approve" hidden></button>
    </div>
  </header>

  <section class="telemetry" id="telemetry" aria-label="Tóm tắt luồng chạy"></section>

  <section class="steer-bar">
    <span class="bar-label">Chỉ thị cả đội</span>
    <input id="company-steer" type="text" placeholder="Ví dụ: Mọi giao diện viết bằng tiếng Việt; ưu tiên hiệu năng hơn tính năng phụ" />
    <label class="check"><input type="checkbox" id="company-redo" /> làm lại phần đã thiết kế</label>
    <button id="company-steer-btn" class="btn btn-small-inline">Gửi chỉ thị</button>
    <div id="company-directives" class="directive-chips"></div>
  </section>

  <nav class="viewbar">
    <div class="tabs" role="tablist">
      <button class="tab active" data-action="view" data-view="org">Sơ đồ tổ chức</button>
      <button class="tab" data-action="view" data-view="flow">Dòng chảy</button>
      <button class="tab" data-action="view" data-view="timeline">Timeline</button>
      <button class="tab" data-action="view" data-view="artifacts">Sản phẩm</button>
    </div>
    <div class="filters" id="filters">
      <button class="filter active" data-action="filter" data-filter="all">Tất cả</button>
      <button class="filter" data-action="filter" data-filter="running">Đang chạy</button>
      <button class="filter" data-action="filter" data-filter="attention">Cần duyệt / Lỗi</button>
      <button class="filter" data-action="filter" data-filter="done">Đã xong</button>
      <button class="filter toggle" id="edges-toggle" data-action="toggle-edges" aria-pressed="false" title="Hiện mọi đường giao việc/bàn giao giữa các nhân sự">↔ Đường nối: <b>Tắt</b></button>
      <span id="focus-chip" class="focus-chip" hidden></span>
    </div>
    <span id="conn" class="conn"></span>
  </nav>

  <main>
    <section id="view-org" class="view">
      <div id="org" class="org">
        <svg id="edges" class="edges" aria-hidden="true">
          <defs>
            <marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-done" /></marker>
            <marker id="arrow-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-pending" /></marker>
            <marker id="arrow-assign" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-assign" /></marker>
          </defs>
        </svg>
        <section class="tier">
          <h2 class="tier-heading tier-heading-1">Sếp</h2>
          <div class="tier-row row-boss" id="row-1"><aside id="plan-panel" class="side-panel plan-panel"></aside></div>
        </section>
        <section class="tier">
          <h2 class="tier-heading tier-heading-2">Trưởng nhóm</h2>
          <div class="tier-row row-leads" id="row-2"><aside id="flow-panel" class="side-panel flow-panel"></aside></div>
        </section>
        <section class="tier">
          <h2 class="tier-heading">Nhân viên</h2>
          <div class="tier-grid" id="row-3"></div>
        </section>
      </div>
    </section>

    <section id="view-flow" class="view" hidden></section>
    <section id="view-timeline" class="view" hidden></section>
    <section id="view-artifacts" class="view" hidden></section>
  </main>

  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Chi tiết task"></aside>

  <div id="inbox-backdrop" class="backdrop" hidden></div>
  <aside id="inbox" class="drawer inbox" hidden aria-label="Hộp duyệt"></aside>

  <div id="g-tip" class="g-tip" hidden></div>

  <div id="modal-backdrop" class="backdrop" hidden></div>
  <div id="modal" class="modal" hidden role="dialog"></div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
